name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, types, tests, contracts, web build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated contract types are up to date
        run: pnpm contracts:check
      - name: Validate configs and contract samples
        run: pnpm validate
      - name: Device qualification summary is up to date
        run: pnpm --filter @neurocapture/device-qualification summary --check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Fetch MediaPipe models (verified)
        run: pnpm models
      - run: pnpm build:web
      - name: Install Playwright browser
        run: pnpm --filter @neurocapture/mobile exec playwright install --with-deps chromium
      - name: E2E (mock mode)
        run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist-and-e2e
          path: |
            apps/mobile/dist
            apps/mobile/test-results
          if-no-files-found: ignore

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - run: pnpm install --frozen-lockfile
      - name: Fetch MediaPipe models (verified)
        run: pnpm models
      - run: pnpm build:web
      - run: pnpm --filter @neurocapture/mobile exec cap sync android
      - name: CaptureKit unit tests (JVM) and debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :neurocapture-capture-kit:testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-kit-unit-test-report
          path: packages/capture-kit/android/build/reports/tests
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  backend:
    name: Backend (ruff, pytest, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neurocapture
          POSTGRES_USER: neurocapture
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U neurocapture" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Azurite (Azure Blob emulator, decision 037)
        working-directory: .
        run: |
          npx --yes azurite@3.35.0 azurite-blob --silent --location "$RUNNER_TEMP/azurite" --skipApiVersionCheck --loose &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1 && break; sleep 1; done
      - run: pytest -q
        env:
          NC_REQUIRE_AZURITE: '1'
      - name: Alembic upgrade against Postgres
        run: alembic upgrade head
        env:
          NC_DATABASE_URL: postgresql+psycopg://neurocapture:ci-only-password@localhost:5432/neurocapture

  dashboard:
    name: Dashboards e2e (real platform + connector + FHIR stand-in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "backend[dev]" -e "connector[dev]"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @neurocapture/dashboard exec playwright install --with-deps chromium
      - name: Dashboards e2e and the no-identity scan (M14 acceptance)
        run: pnpm e2e:dashboard
        env:
          NC_E2E_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-e2e
          path: apps/dashboard/test-results
          if-no-files-found: ignore

  connector:
    name: Connector (ruff, pytest with the platform, contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "../backend[dev]" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Azurite (Azure Blob emulator, decision 037)
        working-directory: .
        run: |
          npx --yes azurite@3.35.0 azurite-blob --silent --location "$RUNNER_TEMP/azurite" --skipApiVersionCheck --loose &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1 && break; sleep 1; done
      - run: pytest -q
        env:
          NC_REQUIRE_AZURITE: '1'
      - name: Connector image builds
        run: docker build -t neurocapture-connector:ci .

  biomarkers:
    name: Biomarker analysis (ruff, pytest with MediaPipe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biomarkers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m ncbio models
      - run: pytest -q
      - name: Analysis image builds
        working-directory: .
        run: docker build -f biomarkers/Dockerfile -t neurocapture-biomarkers:ci .

  compose:
    name: docker compose up → /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:8000/health
      - if: always()
        run: docker compose logs
