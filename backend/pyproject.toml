[project]
name = "neurocapture-backend"
version = "0.1.0"
description = "NeuroCapture API: sessions, takes, uploads (DEV_PLAN §13)."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.6",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.8",
  "psycopg[binary]==3.3.9",
  "alembic==1.20.1",
  "pydantic-settings==2.16.3",
  "boto3==1.44.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.5"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "analysis*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
