[project]
name = "neurocapture-biomarkers"
version = "0.1.0"
description = "Biomarker analysis at the hospital (M15, decision 057): keypoints from the 60 fps video, then the DNE formulas."
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.5",
  "scipy==1.18.1",
  "mediapipe==1.2.3",
  "opencv-python-headless==5.1.0.95",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5", "jsonschema==4.25.1"]

[project.scripts]
ncbio = "ncbio.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ncbio*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]
"ncbio/*" = ["N806"]
