[project]
name = "neurocapture-connector"
version = "0.1.0"
description = "NeuroCapture hospital connector: live patient records, NCID map, invites, clinical activity log, take decryption (PLATFORM_PLAN M11)."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.6",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.8",
  "psycopg[binary]==3.3.9",
  "pydantic-settings==2.16.3",
  "httpx==0.28.1",
  "pyjwt==2.10.1",
  "cryptography==46.0.3",
  "tink==1.12.0",
  "segno==1.6.6",
  "boto3==1.44.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5", "pyyaml==6.0.3", "moto[s3,sts]==5.2.5"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ncconnector*"]

[tool.setuptools.package-data]
ncconnector = ["messages/*.json"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
