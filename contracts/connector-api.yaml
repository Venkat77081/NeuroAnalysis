        actor_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Actor Id
        action:
          type: string
          maxLength: 50
          title: Action
        ncid:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Ncid
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      type: object
      required:
      - actor_type
      - action
      title: ActivityIn
    ActivityOut:
      properties:
        at:
          type: string
          format: date-time
          title: At
        actor_type:
          type: string
          title: Actor Type
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
        action:
          type: string
          title: Action
        ncid:
          anyOf:
          - type: string
          - type: 'null'
          title: Ncid
        details:
          anyOf:
