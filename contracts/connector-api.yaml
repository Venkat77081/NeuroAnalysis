  securitySchemes:
    connectorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA, aud site:<id>) from POST /hospital/connector-token
    signedRequest:
      type: apiKey
      in: header
      name: X-NC-Signature
      description: 'Ed25519-signed request. Signed bytes: METHOD \n PATH?QUERY \n
        X-NC-Timestamp \n X-NC-Nonce \n

        hex(SHA-256(body)). Headers: X-NC-Key (signer: "platform" or the hospital''s
        site ID),

        X-NC-Timestamp (unix seconds, within 300 s), X-NC-Nonce (16-64 chars, single
        use),

        X-NC-Signature (base64url of the signature, no padding).'
