          enum:
          - pass
          - fail
          title: Records
        ncid_map:
          type: string
          enum:
          - pass
          - fail
          title: Ncid Map
        activity_log:
          type: string
          enum:
          - pass
          - fail
          title: Activity Log
        decrypt_key:
          type: string
          enum:
          - pass
          - fail
          title: Decrypt Key
      type: object
      required:
      - records
      - ncid_map
      - activity_log
      - decrypt_key
      title: CheckOut
    ConnectorIn:
      properties:
        url:
          type: string
          maxLength: 300
          minLength: 8
          pattern: ^https?://[^\s]+$
          title: Url
        public_key_pem:
          type: string
          maxLength: 2000
          minLength: 40
          title: Public Key Pem
      type: object
      required:
      - url
      - public_key_pem
      title: ConnectorIn
    ConnectorOut:
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        registered:
          type: boolean
          title: Registered
        platform_key_sha256:
          type: string
          title: Platform Key Sha256
        check:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Check
        checked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Checked At
      type: object
      required:
      - url
      - registered
      - platform_key_sha256
      - check
      - checked_at
      title: ConnectorOut
    ConnectorTokenOut:
      properties:
        token:
          type: string
          title: Token
        expires_in:
          type: integer
          title: Expires In
        connector_url:
          type: string
          title: Connector Url
      type: object
      required:
      - token
      - expires_in
      - connector_url
      title: ConnectorTokenOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthOut:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
      type: object
      required:
      - status
      - version
      title: HealthOut
    HistoryItemOut:
      properties:
        text:
          type: string
          title: Text
        date:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      type: object
      required:
      - text
      title: HistoryItemOut
    InviteIn:
