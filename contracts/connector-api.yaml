          title: Ncid
        invite_link:
          anyOf:
          - type: string
          - type: 'null'
          title: Invite Link
        qr_png_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Qr Png Base64
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - mrn
      - result
      title: InviteResult
    KeyIn:
      properties:
        public_key_pem:
          type: string
          maxLength: 4000
          minLength: 100
          title: Public Key Pem
      type: object
      required:
      - public_key_pem
      title: KeyIn
    KeyOut:
      properties:
        key_id:
          type: string
          title: Key Id
        fingerprint:
          type: string
          title: Fingerprint
        status:
          type: string
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        retired_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Retired At
        retired_key_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Retired Key Id
      type: object
      required:
      - key_id
      - fingerprint
      - status
      - created_at
      - retired_at
      title: KeyOut
    NcidIn:
      properties:
        mrn:
          type: string
          maxLength: 64
          minLength: 1
          title: Mrn
      type: object
      required:
      - mrn
      title: NcidIn
    NcidOut:
      properties:
        ncid:
          type: string
          title: Ncid
        created:
          type: boolean
          title: Created
      type: object
      required:
      - ncid
      - created
