          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers: *id001
  /connector/v1/takes/{take_id}:
    get:
      tags:
      - connector
      summary: Connector Take
      description: 'Encrypted files of one complete take, with short-lived download
        links. Only this hospital''s

        connector can unwrap the data key.'
      operationId: connector_take_connector_v1_takes__take_id__get
      parameters:
      - name: take_id
        in: path
        required: true
        schema:
          type: string
          title: Take Id
