          default: email
      type: object
      title: NewPatientIn
    NewPatientOut:
      properties:
        ncid:
          type: string
          title: Ncid
        invite_link:
          anyOf:
          - type: string
          - type: 'null'
          title: Invite Link
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        app_status:
          anyOf:
          - type: string
          - type: 'null'
          title: App Status
      type: object
      required:
      - ncid
      title: NewPatientOut
    ObjectLocation:
      properties:
        kind:
          type: string
          title: Kind
          default: s3
        bucket:
          type: string
          title: Bucket
        key:
          type: string
          title: Key
        region:
          anyOf:
          - type: string
          - type: 'null'
          title: Region
        endpoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpoint
      type: object
      required:
      - bucket
      - key
      title: ObjectLocation
      description: 'A file in the hospital''s own bucket: the connector reads it with
        the hospital''s credentials.'
    PatientRow:
      properties:
        mrn:
          type: string
          title: Mrn
        name:
          type: string
          title: Name
        birth_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Birth Date
        sex:
          anyOf:
          - type: string
          - type: 'null'
          title: Sex
        has_email:
          type: boolean
          title: Has Email
        has_phone:
          type: boolean
          title: Has Phone
        ncid:
          anyOf:
