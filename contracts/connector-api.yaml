      operationId: connector_verified_connector_v1_takes__take_id__files__kind__verified_post
      parameters:
      - name: take_id
        in: path
        required: true
        schema:
          type: string
          title: Take Id
      - name: kind
        in: path
        required: true
        schema:
          type: string
