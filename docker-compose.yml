# Local development stack (DEV_PLAN §4): API + PostgreSQL + MinIO (S3-compatible).
# Dev-only credentials below; never reuse them anywhere else.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neurocapture
      POSTGRES_USER: neurocapture
      POSTGRES_PASSWORD: dev-only-password
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neurocapture -d neurocapture']
      interval: 3s
      timeout: 3s
      retries: 20

  # Object storage is opt-in until an S3-compatible image is approved (decision 004):
  #   NC_MINIO_IMAGE=<approved image> NC_S3_ENDPOINT=http://minio:9000 docker compose --profile storage up -d
  # The official minio/minio image is no longer published on Docker Hub.
  minio:
    profiles: ['storage']
    image: ${NC_MINIO_IMAGE:-set-nc-minio-image-see-decision-004}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neurocapture
      MINIO_ROOT_PASSWORD: dev-only-password
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: neurocapture-api:dev
    environment:
      NC_DATABASE_URL: postgresql+psycopg://neurocapture:dev-only-password@postgres:5432/neurocapture
      NC_S3_ENDPOINT: ${NC_S3_ENDPOINT:-}
      NC_S3_ACCESS_KEY: neurocapture
      NC_S3_SECRET_KEY: dev-only-password
      NC_S3_BUCKET: neurocapture-takes
    ports: ['8000:8000']
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
